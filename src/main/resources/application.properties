spring.application.name=homealbumserver
storage.base-path=./path-to-store-files-on-server
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
logging.level.org.springframework.web=DEBUG
spring.datasource.url=jdbc:h2:file:./data/homealbumdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user-for-db-h2
spring.datasource.password=password-for-db-h2

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
